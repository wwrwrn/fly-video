<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕的海岸骑行 · Pelican Ride</title>
<style>
  :root { color-scheme: light; --paper:#f7f5ed; --ink:#253e40; --muted:#7b8985; --line:#dce1d7; --accent:#d56a46; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
  main { max-width:1280px; margin:auto; padding:34px 50px 24px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .brand { font-size:12px; font-weight:750; letter-spacing:3px; display:flex; align-items:center; gap:12px; }
  .brand svg { width:30px; height:30px; }
  .edition { color:var(--muted); font-size:11px; letter-spacing:2px; }
  .intro { margin:54px 0 24px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
  .eyebrow { color:var(--accent); font-size:11px; letter-spacing:3px; margin:0 0 13px; }
  h1 { font-size:clamp(30px,4vw,48px); font-weight:550; letter-spacing:2px; margin:0; }
  .intro p:last-child { margin:13px 0 0; color:var(--muted); font-size:13px; letter-spacing:1px; }
  .stamp { font:italic 16px Georgia,serif; color:#8a9389; padding-bottom:5px; }
  .scene { position:relative; overflow:hidden; border:1px solid #e2e5d9; border-radius:18px; background:#eaf0e4; }
  #landscape { display:block; width:100%; height:auto; }
  .scene-label { position:absolute; top:24px; left:26px; display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:2px; color:#537570; }
  .dot { width:6px; height:6px; border-radius:50%; background:#669783; }
  .scene-note { position:absolute; right:25px; bottom:20px; font-size:10px; letter-spacing:2px; color:#627c70; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; gap:24px; padding:24px 0; border-bottom:1px solid var(--line); }
  .tools { display:flex; align-items:center; gap:25px; }
  button { font:inherit; cursor:pointer; }
  #play { display:flex; gap:10px; align-items:center; border:0; border-radius:30px; background:var(--ink); color:#fff; padding:13px 21px; font-size:12px; min-width:115px; justify-content:center; }
  button:hover { filter:brightness(1.13); }
  button:focus-visible, input:focus-visible { outline:3px solid #da9872; outline-offset:5px; }
  .speed { display:flex; align-items:center; gap:13px; font-size:12px; color:#647875; }
  input { width:115px; accent-color:#3b7270; cursor:pointer; }
  output { font-variant-numeric:tabular-nums; width:35px; color:var(--ink); }
  #sunset { display:flex; align-items:center; gap:9px; background:transparent; border:1px solid #cdd6cb; border-radius:24px; padding:11px 17px; font-size:12px; color:var(--ink); }
  #sunset[aria-pressed="true"] { background:#f2d8ba; border-color:#d9b28e; }
  footer { display:flex; justify-content:space-between; gap:20px; padding-top:20px; font-size:10px; letter-spacing:1.5px; color:#89938b; }
  .sky-stop,.sea,.sun { transition:stop-color 1s,fill 1s; }
  .evening .sky-stop:first-child { stop-color:#edbcac; }
  .evening .sky-stop:last-child { stop-color:#ffe6bb; }
  .evening .sea { fill:#8ea9a0; }
  .evening .sun { fill:#ee9565; }
  @media(max-width:640px) {
    main { padding:23px 18px; } .edition,.stamp { display:none; } .intro { margin-top:38px; }
    .scene { border-radius:12px; } #landscape { width:160%; max-width:none; margin-left:-30%; }
    .scene-label { top:15px; left:15px; font-size:8px; } .scene-note { right:14px; bottom:12px; font-size:8px; }
    .toolbar { gap:18px; flex-wrap:wrap; padding:20px 0; } .tools { gap:15px; } .speed { gap:7px; } input { width:80px; }
    #play { padding:12px 16px; min-width:100px; } footer { font-size:9px; letter-spacing:.5px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor"/><path d="M7 19 Q13 7 19 14 L27 15 L19 18 Q19 25 10 23" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg> LITTLE WANDER</div>
    <span class="edition">THE SLOW DAYS COLLECTION / 001</span>
  </header>
  <section class="intro">
    <div><p class="eyebrow">A LITTLE RIDE, A LOVELY DAY</p><h1>把日子，骑慢一点。</h1><p>跟着鹈鹕，沿海岸吹一会儿风。</p></div>
    <span class="stamp">Nowhere to rush.</span>
  </section>
  <section class="scene" aria-label="海岸上的鹈鹕骑车动画">
    <div class="scene-label"><span class="dot"></span> COASTAL ROUTE · 海岸漫游</div>
    <svg id="landscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="sceneTitle sceneDesc">

      <desc id="sceneDesc">鹈鹕双脚交替踩踏，车轮持续转动，白云、海浪和路边植物向后移动。可通过下方控件暂停或调节速度。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop class="sky-stop" stop-color="#e9efe4"/><stop class="sky-stop" offset="1" stop-color="#f7f0d8"/></linearGradient>
        <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#f5c16e"/><stop offset="1" stop-color="#eaa059"/></linearGradient>
        <pattern id="ripples" width="260" height="64" patternUnits="userSpaceOnUse"><path d="M10 16h56m71 30h81m-142 10h24" fill="none" stroke="#e3eee3" stroke-width="2" stroke-linecap="round" opacity=".65"/></pattern>
        <g id="cloud" fill="#fffdf4" opacity=".72"><path d="M0 24 Q5 8 27 11 Q37-10 58 1 Q76-2 83 14 Q107 10 112 24Z"/></g>
        <g id="grass" fill="none" stroke="#718c66" stroke-width="3" stroke-linecap="round"><path d="M0 0q-2-20-13-27M0 0q2-29 11-36M0 0q11-14 21-16"/><path d="M11-36l-2-7m4 4 4-5" stroke="#a8ae78" stroke-width="5"/></g>
        <g id="wheel" stroke="#2d4a48" fill="none">
          <circle r="87" stroke-width="10"/><circle r="79" stroke="#faf4df" stroke-width="3"/>
          <g class="spokes" stroke="#819993" stroke-width="1.7"><path d="M-77 0H77M0-77V77M-54.45-54.45 54.45 54.45M-54.45 54.45 54.45-54.45M-71.14-29.47 71.14 29.47M-29.47-71.14 29.47 71.14M-71.14 29.47 71.14-29.47M-29.47 71.14 29.47-71.14"/><path d="M30-70a76 76 0 0 1 27 18" stroke="#d68b52" stroke-width="5"/></g>
          <circle r="9" fill="#e6e5cf" stroke-width="3"/>
        </g>
      </defs>
      <path fill="url(#sky)" d="M0 0H1200V590H0Z"/>
      <circle class="sun" cx="964" cy="121" r="47" fill="#edd69a"/>
      <circle cx="964" cy="121" r="60" fill="none" stroke="#f9f1d9" opacity=".7"/>
      <g id="clouds"><use href="#cloud" x="115" y="103"/><use href="#cloud" x="545" y="66" transform="translate(150 28) scale(.75)"/><use href="#cloud" x="1060" y="188"/><use href="#cloud" x="1415" y="103"/></g>
      <path d="M0 317Q126 281 240 307T476 307Q553 288 675 315T911 299T1200 312V396H0Z" fill="#c4d4bd" opacity=".68"/>
      <path class="sea" d="M0 335Q300 331 600 338T1200 334V460H0Z" fill="#adcbc3"/>
      <path d="M0 344H1200" stroke="#e9efe0" stroke-width="2"/>
      <path id="water" d="M0 349H1200V453H0Z" fill="url(#ripples)"/>
      <g id="gulls" fill="none" stroke="#81958a" stroke-width="2" stroke-linecap="round"><path d="M174 216q9-10 18 0 9-10 18 0M847 203q7-7 14 0 7-7 14 0M905 232q5-6 11 0 5-6 11 0"/></g>
      <path d="M0 421Q176 400 348 423T737 420T1200 415V590H0Z" fill="#d4d9b6"/>
      <path d="M0 464Q320 452 600 461T1200 459V541H0Z" fill="#eee6cd"/>
      <path d="M0 540Q306 538 601 545T1200 540V590H0Z" fill="#c9d0aa"/>
      <g id="roadMarks" stroke="#fff9e8" stroke-width="3" stroke-linecap="round" opacity=".95"><path d="M-240 521h85M0 521h85M240 521h85M480 521h85M720 521h85M960 521h85M1200 521h85M1440 521h85"/></g>
      <g id="plants"><use href="#grass" x="125" y="462"/><use href="#grass" x="960" y="447" transform="translate(288 134) scale(.7)"/><use href="#grass" x="520" y="572"/><use href="#grass" x="1120" y="570"/><use href="#grass" x="1425" y="462"/><use href="#grass" x="1820" y="572"/><use href="#grass" x="2420" y="570"/><g fill="#a4ae83"><ellipse cx="280" cy="555" rx="10" ry="3"/><ellipse cx="812" cy="452" rx="7" ry="2"/><ellipse cx="1580" cy="555" rx="10" ry="3"/></g></g>
      <ellipse id="shadow" cx="605" cy="501" rx="243" ry="13" fill="#727f68" opacity=".14"/>
      <g id="rider">
        <!-- The far leg is behind the frame; both feet are attached to the crank. -->
        <path id="farLeg" d="" fill="none" stroke="#d69248" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="farFoot" d="" fill="#d99a4f" stroke="#b47b3f" stroke-width="1.5"/>
        <g transform="translate(430 410)"><use href="#wheel"/></g>
        <g transform="translate(770 410)"><use href="#wheel"/></g>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M350 383A86 86 0 0 1 505 368M695 366A87 87 0 0 1 850 381" stroke="#688f7d" stroke-width="6"/>
          <path d="M430 410 507 291 577 410 430 410 688 294 577 410M507 291 688 294M688 294 770 410" stroke="#315b56" stroke-width="11"/>
          <path d="M430 410 507 291 577 410M507 291 688 294M688 294 770 410" stroke="#6ca092" stroke-width="5"/>
          <path d="M507 291 494 265M688 294 674 253Q670 242 687 239L719 237" stroke="#3b5550" stroke-width="8"/>
          <path d="M714 237h23" stroke="#aa7150" stroke-width="11"/>
          <path d="M720 246Q747 291 710 321" stroke="#56776d" stroke-width="2"/>
          <path d="M466 267Q492 258 522 266" stroke="#664f3f" stroke-width="13"/>
          <path d="M430 397 571 389A22 22 0 0 1 577 431L430 423" stroke="#6c8274" stroke-width="2"/>
        </g>
        <circle cx="577" cy="410" r="24" fill="#e4e3ce" stroke="#3c625a" stroke-width="4"/>
        <circle cx="577" cy="410" r="16" fill="none" stroke="#839a87" stroke-width="2" stroke-dasharray="3 4"/>
        <path id="crank" fill="none" stroke="#36574f" stroke-width="5" stroke-linecap="round"/>
        <g id="bird">
          <!-- Tail, pear-shaped body, long neck and characteristic bill pouch. -->
          <path d="M467 248Q427 259 397 231L438 231 411 215Q451 220 477 235" fill="#eeeee2" stroke="#495d52" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M472 197Q438 205 446 239Q454 277 513 285Q566 292 590 258Q608 236 608 201L611 137Q631 123 626 101Q621 80 599 81Q575 78 567 99Q560 125 567 161Q564 186 536 193Q503 187 472 197Z" fill="#fffcf0" stroke="#495d52" stroke-width="3"/>
          <path d="M452 241Q485 277 532 265Q565 256 576 228Q568 274 533 282Q475 286 452 252Z" fill="#dedfce"/>
          <path d="M474 208Q510 194 549 214Q555 233 525 251Q498 265 471 239Q495 244 512 232Q489 239 470 226Q493 230 511 220" fill="#f1efe0" stroke="#b5beaa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M569 160Q569 186 591 204" fill="none" stroke="#dedfce" stroke-width="9" stroke-linecap="round"/>
          <path d="M606 115 753 122Q726 147 691 176Q673 192 649 177Q621 158 606 115Z" fill="url(#pouch)" stroke="#8e7044" stroke-width="2.5"/>
          <path d="M613 107Q673 104 760 120Q771 122 760 127L610 120Z" fill="#efb758" stroke="#8e7044" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M624 132Q650 171 675 173" fill="none" stroke="#fbd59a" stroke-width="3" stroke-linecap="round"/>
          <circle cx="605" cy="101" r="6.5" fill="#2d4440"/><circle cx="607" cy="99" r="2" fill="#fff"/>
          <path d="M587 88q-7-14-16-10m18 9q-1-15-7-18" fill="none" stroke="#495d52" stroke-width="3" stroke-linecap="round"/>
          <path d="M565 167Q584 180 610 170L611 186Q584 196 564 181Z" fill="#cb6246" stroke="#995541" stroke-width="2"/>
          <path id="scarf" d="M569 179Q533 166 502 180L513 190 501 199Q538 184 573 191Z" fill="#d97553" stroke="#995541" stroke-width="2" stroke-linejoin="round"/>
          <path d="M572 214Q598 244 678 247L704 239" fill="none" stroke="#495d52" stroke-width="17" stroke-linecap="round"/>
          <path d="M572 212Q600 240 677 244L703 237" fill="none" stroke="#f9f8e9" stroke-width="12" stroke-linecap="round"/>
          <path d="m681 241 10 8m-1-10 11 7" stroke="#b8c2ae" stroke-width="2" stroke-linecap="round"/>
        </g>
        <path id="nearLeg" d="" fill="none" stroke="#e6a74e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="nearFoot" d="" fill="#efb456" stroke="#a88046" stroke-width="2" stroke-linejoin="round"/>
        <g stroke="#354f47" stroke-width="6" stroke-linecap="round"><path id="nearPedal"/><path id="farPedal"/></g>
        <circle cx="577" cy="410" r="5" fill="#3b6156"/>
      </g>
    </svg>
    <div class="scene-note">SALTY AIR. HAPPY FEET.</div>
  </section>
  <div class="toolbar">
    <div class="tools">
      <button id="play" type="button" aria-label="暂停动画"><span id="playIcon" aria-hidden="true">Ⅱ</span><span id="playText">暂停骑行</span></button>
      <label class="speed" for="speed">速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speedValue" for="speed">1×</output></label>
    </div>
    <button id="sunset" type="button" aria-pressed="false"><span aria-hidden="true">☼</span> 日落模式</button>
  </div>
  <footer><span>一只鹈鹕，一辆单车，一段好时光。</span><span>DRAWN IN SVG · MADE TO WANDER</span></footer>
</main>
<script>
(() => {
  'use strict';
  const el = id => document.getElementById(id);
  const spokes = document.querySelectorAll('.spokes');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let running = !reducedMotion.matches, speed = 1, time = 0, last = null;
  function updateButton() {
    el('playIcon').textContent = running ? 'Ⅱ' : '▶';
    el('playText').textContent = running ? '暂停骑行' : '继续骑行';
    el('play').setAttribute('aria-label', running ? '暂停动画' : '播放动画');
  }
  function leg(side, angle, bob) {
    const x = 577 + Math.cos(angle) * 33, y = 410 + Math.sin(angle) * 33;
    const hipX = side === 'near' ? 520 : 535, hipY = 275 + bob;
    // A two-segment leg keeps the ankle on its pedal throughout the cycle.
    const dx = x - hipX, dy = y - 7 - hipY, distance = Math.hypot(dx,dy);
    const upper = 94, lower = 91;
    const along = (upper*upper - lower*lower + distance*distance)/(2*distance);
    const offset = Math.sqrt(Math.max(0,upper*upper-along*along));
    const kneeX = hipX + along*dx/distance + offset*dy/distance;
    const kneeY = hipY + along*dy/distance - offset*dx/distance;
    el(side+'Leg').setAttribute('d',`M${hipX} ${hipY} L${kneeX} ${kneeY} L${x} ${y-7}`);
    el(side+'Foot').setAttribute('d',`M${x-5} ${y-12} Q${x+7} ${y-9} ${x+21} ${y-3} L${x+13} ${y} L${x-12} ${y}Z`);
    el(side+'Pedal').setAttribute('d',`M${x-13} ${y+3}h31`);
    return {x,y};
  }
  function draw() {
    const angle = time * 2.9, bob = Math.sin(angle*2)*2;
    const near = leg('near',angle,bob), far = leg('far',angle+Math.PI,bob);
    el('crank').setAttribute('d',`M${near.x} ${near.y}L577 410L${far.x} ${far.y}`);
    spokes.forEach(s => s.setAttribute('transform',`rotate(${time*135})`));
    el('bird').setAttribute('transform',`translate(0 ${bob})`);
    el('scarf').setAttribute('d',`M569 179Q533 ${160+Math.sin(time*5)*7} 502 ${175+Math.sin(time*5+1)*8}L513 190 501 ${197+Math.sin(time*5+1)*6}Q538 ${184+Math.sin(time*5)*5} 573 191Z`);
    el('roadMarks').setAttribute('transform',`translate(${-time*150%240} 0)`);
    el('plants').setAttribute('transform',`translate(${-time*150%1300} 0)`);
    el('clouds').setAttribute('transform',`translate(${-time*10%1300} 0)`);
    document.getElementById('ripples').setAttribute('patternTransform',`translate(${-time*23%260} 0)`);
    el('gulls').setAttribute('transform',`translate(0 ${Math.sin(time*.8)*4})`);
  }
  function frame(now) {
    if (last !== null && running) time += Math.min((now-last)/1000,.05)*speed;
    last = now;
    if(running) draw();
    requestAnimationFrame(frame);
  }
  el('play').addEventListener('click',() => {running=!running; updateButton();});
  el('speed').addEventListener('input',event => {speed=Number(event.target.value); el('speedValue').value=speed+'×';});
  el('sunset').addEventListener('click',() => {
    const evening = el('landscape').classList.toggle('evening');
    el('sunset').setAttribute('aria-pressed',String(evening));
  });
  reducedMotion.addEventListener('change',event => {if(event.matches) {running=false; updateButton();}});
  document.addEventListener('visibilitychange',() => {last=null;});
  updateButton(); draw(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
