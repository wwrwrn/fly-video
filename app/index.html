<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>果蝇攀爬分析</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --raised: #ffffff; --line: #e2e0da; --line-strong: #c9c6bd;
  --text: #17171a; --text-2: #52514e; --text-3: #7a7873; --accent: #2a78d6; --accent-soft: #e4eefa;
  --good: #137a4a; --good-soft: #e0f2e9; --warn: #9a5b00; --warn-soft: #fbeed2; --bad: #b42b2b; --bad-soft: #fbe4e3;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --shadow: 0 1px 2px rgba(20, 20, 18, .06), 0 8px 24px rgba(20, 20, 18, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --raised: #222220; --line: #2e2e2b; --line-strong: #45443f;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #94928a; --accent: #3987e5; --accent-soft: #1d2d42;
    --good: #5fc897; --good-soft: #17352a; --warn: #e6b45c; --warn-soft: #3a2c12; --bad: #f08a88; --bad-soft: #402020;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; }
aside { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 16px 16px 12px; font-size: 16px; font-weight: 650; }
.brand small { display: block; font-size: 12px; font-weight: 400; color: var(--text-3); }
.drop { margin: 0 12px; padding: 16px 12px; border: 1.5px dashed var(--line-strong); border-radius: 10px; text-align: center; color: var(--text-2); transition: .15s; cursor: pointer; }
.drop strong { display: block; color: var(--text); font-weight: 600; }
.drop span { font-size: 12px; color: var(--text-3); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.group-row { margin: 8px 12px 0; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
.group-row input { flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); }
.jobs { padding: 10px 12px 0; display: grid; gap: 6px; }
.job { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); font-size: 12px; }
.job.link { cursor: pointer; }
.job .name { display: flex; justify-content: space-between; gap: 8px; }
.job .name b { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .msg { color: var(--text-3); margin-top: 2px; overflow-wrap: anywhere; }
.bar { height: 4px; margin-top: 6px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.tree { flex: 1; overflow: auto; padding: 10px 8px 16px; min-height: 0; }
.nav { display: flex; width: 100%; justify-content: space-between; gap: 8px; padding: 6px 10px; border: 0; border-radius: 7px; background: none; text-align: left; }
.nav:hover { background: var(--bg); }
.nav.on { background: var(--accent-soft); }
.nav small { color: var(--text-3); white-space: nowrap; }
.tree h3 { padding: 12px 10px 2px; font-size: 12px; font-weight: 600; color: var(--text-3); }
.tree details summary { list-style: none; cursor: pointer; padding: 6px 10px; border-radius: 7px; display: flex; justify-content: space-between; font-weight: 550; }
.tree details summary::-webkit-details-marker { display: none; }
.tree details summary:hover { background: var(--bg); }
.tree details summary small { color: var(--text-3); font-weight: 400; }
main { overflow: auto; padding: 20px 24px 40px; min-width: 0; }
.page { max-width: 1160px; margin: 0 auto; display: grid; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.head h1 { font-size: 22px; font-weight: 650; }
.head span { color: var(--text-3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card > h2 { font-size: 15px; font-weight: 620; }
.card > p.sub { font-size: 12px; color: var(--text-3); margin-bottom: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.stat b { display: block; font-size: 26px; font-weight: 650; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--text-3); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--text-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 4px 12px; }
.seg button.on { background: var(--accent); color: #fff; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend i.hollow { background: none !important; border: 1.5px solid var(--text-3); }
.legend i.tick { width: 2px; height: 12px; border-radius: 1px; background: var(--text); }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th { text-align: right; font-weight: 550; font-size: 12px; color: var(--text-3); padding: 6px 10px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
.scroll { overflow-x: auto; }
.small-n { color: var(--warn); font-size: 12px; }
.detail { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
video { width: 100%; display: block; border-radius: 8px; background: #000; }
.tubes { display: grid; gap: 8px; }
.tube { display: grid; grid-template-columns: 34px 1fr auto; gap: 2px 8px; align-items: center; width: 100%; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 9px; text-align: left; }
.tube:hover { border-color: var(--line-strong); }
.tube .no { grid-row: span 2; display: flex; align-items: center; gap: 5px; font-weight: 650; }
.tube .no i { width: 8px; height: 8px; border-radius: 50%; }
.tube .main { font-weight: 550; font-variant-numeric: tabular-nums; }
.tube .sub { grid-column: 2 / 4; font-size: 12px; color: var(--text-3); }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.chip.good { color: var(--good); background: var(--good-soft); }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.plain { color: var(--text-2); background: var(--bg); }
svg text { fill: var(--text-3); font-size: 11px; font-family: inherit; }
.grid-line { stroke: var(--line); }
.axis-line { stroke: var(--line-strong); }
.finish { stroke: var(--bad); stroke-dasharray: 5 4; }
svg text.finish-label { fill: var(--bad); }
svg text.direct { font-weight: 650; fill: var(--text-2); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; touch-action: none; }
.tip { position: fixed; z-index: 30; pointer-events: none; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: var(--shadow); max-width: 260px; display: none; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 600; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 16px; font-size: 13px; }
.facts div span { display: block; font-size: 12px; color: var(--text-3); }
.links { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; }
a { color: var(--accent); }
img.preview { width: 100%; border-radius: 8px; display: block; }
.empty { padding: 40px; text-align: center; color: var(--text-3); }
.modal { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(0, 0, 0, .55); padding: 20px; overflow: auto; }
.modal.open { display: block; }
.sheet { max-width: 1080px; margin: 0 auto; background: var(--surface); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
.sheet canvas { max-width: 100%; max-height: calc(100vh - 210px); margin: 0 auto; display: block; border-radius: 8px; cursor: crosshair; }
.step { font-size: 16px; font-weight: 620; }
.step.error { color: var(--bad); }
.note { font-size: 13px; color: var(--text-2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.btn { padding: 6px 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
a.btn { text-decoration: none; color: var(--text); white-space: nowrap; }
.pick-folder { display: none; margin-top: 4px; font-size: 12px; }
.desktop .pick-folder { display: inline-block; }
.row { display: flex; align-items: center; gap: 2px; }
.row .nav { flex: 1; min-width: 0; }
.more { flex: none; width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--text-3); line-height: 1; }
.more:hover, .more:focus-visible { background: var(--line); color: var(--text); }
.tree details summary { align-items: center; }
.tree .side, .job .side { display: flex; align-items: center; gap: 4px; }
.job .x { border: 0; background: none; color: var(--text-3); padding: 0 2px; font-size: 15px; line-height: 1; }
.job .x:hover { color: var(--text); }
.menu { position: fixed; z-index: 25; display: none; min-width: 168px; padding: 4px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 9px; box-shadow: var(--shadow); }
.menu.open { display: block; }
.menu button { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: 6px; background: none; text-align: left; }
.menu button:hover { background: var(--bg); }
.menu button.danger { color: var(--bad); }
.ask .sheet { max-width: 440px; margin-top: 12vh; }
.ask input { width: 100%; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--raised); }
.head-actions { margin-left: auto; display: flex; gap: 8px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
th.left, td.left { text-align: left; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 16px; overflow: visible; }
  .detail { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">果蝇攀爬分析<small id="brand-sub">六管单蝇 · 本机运行，视频不外传</small></div>
    <div class="drop" id="drop" role="button" tabindex="0">
      <strong>拖入视频或文件夹</strong>
      <span>也可以点这里选择 MP4</span><br>
      <a href="#" class="pick-folder" id="pick-folder">选择整个文件夹</a>
      <input id="picker" type="file" accept=".mp4" multiple hidden>
    </div>
    <label class="group-row">分组 <input id="group" placeholder="如 W118 雄，文件夹自动识别"></label>
    <div class="jobs" id="jobs"></div>
    <div class="tree" id="tree"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="tip" id="tip"></div>
<div class="modal" id="modal"><div class="sheet">
  <div class="step" id="step"></div>
  <div class="note" id="note"></div>
  <canvas id="canvas"></canvas>
  <div class="actions">
    <button class="btn" id="cancel">取消</button>
    <button class="btn" id="undo">撤销一步</button>
    <button class="btn primary" id="save" hidden>标定正确，开始分析</button>
  </div>
</div></div>
<div class="menu" id="menu" role="menu"></div>
<div class="modal ask" id="ask"><div class="sheet">
  <div class="step" id="ask-title"></div>
  <div class="note" id="ask-text"></div>
  <input id="ask-input" list="group-list" hidden>
  <datalist id="group-list"></datalist>
  <div class="actions"><button class="btn" id="ask-cancel">取消</button><button class="btn primary" id="ask-ok">确定</button></div>
</div></div>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = (value, digits = 2) => value === null || value === undefined || value === "" ? "—" : Number(value).toFixed(digits);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const median = values => { const s = [...values].sort((a, b) => a - b), m = s.length >> 1; return s.length ? (s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2) : null; };
async function api(path, body) {
  const response = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : undefined);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "请求失败");
  return data;
}
const OUTCOME = {first_crossing_recorded: ["已过线", "good"], not_reached: ["未过线", "plain"], already_above_line: ["开始时已在线上", "warn"]};
const FLAGS = {
  initial_position_above_bottom: "起点已离开管底", reacquired_after_gap: "跟丢后接回", identity_reacquisition_review: "跟丢后接回",
  first_observation_after_frame0: "首帧没有检测到", crossing_bracket_has_missing_frames: "过线前后有缺帧", crossing_geometry_uncertain: "过线时相机配准不确定",
  ambiguous_detection: "同帧有多个候选", already_above_finish_at_first_observation: "首次检测已在线上", finish_line_low_contrast_review: "横线对比度低",
  long_tracking_gap: "长时间跟丢，未过线不可靠"};
const STATES = {uploading: "上传中", queued: "排队中", running: "分析中", done: "完成", failed: "失败", needs_calibration: "需要标定"};
const SERIES = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6"];
let view = {page: "overview"}, data = {videos: [], tubes: []}, jobs = [], uploads = [];
let metric = "net_speed", withReview = false;

/* 导航和总览 */
function tree() {
  const groups = {};
  data.videos.forEach(video => (groups[video.group] ??= []).push(video));
  const more = (attribute, value, label) => `<button class="more" ${attribute}="${esc(value)}" title="${label}" aria-label="${label}">⋯</button>`;
  $("tree").innerHTML = `<button class="nav ${view.page === "overview" ? "on" : ""}" data-overview>全部分组总览</button><h3>视频</h3>` +
    (Object.keys(groups).length ? Object.entries(groups).map(([group, videos]) => `<details ${videos.some(v => v.run === view.run) ? "open" : ""}>
      <summary><span>${esc(group)}</span><span class="side"><small>${videos.length} 段</small>${videos.every(v => v.editable) ? more("data-group-menu", group, "重命名或删除这个分组") : ""}</span></summary>
      ${videos.map(v => `<div class="row"><button class="nav ${v.run === view.run ? "on" : ""}" data-run="${esc(v.run)}"><span>${esc(v.stem.replace(/^\d{8}_/, ""))}</span><small>过线 ${v.crossed}/${v.tubes}</small></button>${v.editable ? more("data-menu", v.run, "改分组或删除") : ""}</div>`).join("")}
    </details>`).join("") : `<p class="note" style="padding:6px 10px">还没有结果</p>`);
}
function groupStats() {
  const groups = {};
  data.tubes.forEach(tube => (groups[tube.group] ??= []).push(tube));
  return Object.entries(groups).map(([group, tubes]) => {
    const used = tubes.filter(t => t[metric] !== null && (withReview || t.quality !== "review"));
    return {group, tubes, used, crossed: tubes.filter(t => t.outcome === "first_crossing_recorded").length,
            notReached: tubes.filter(t => t.outcome === "not_reached").length,
            review: tubes.filter(t => t.quality === "review").length, median: median(used.map(t => t[metric]))};
  });
}
function renderOverview() {
  const stats = groupStats(), tubes = data.tubes;
  if (!tubes.length) { $("main").innerHTML = `<div class="page"><div class="card empty">把视频拖到左边开始分析，结果会显示在这里。</div></div>`; return; }
  const crossed = tubes.filter(t => t.outcome === "first_crossing_recorded").length;
  const review = tubes.filter(t => t.quality === "review").length;
  $("main").innerHTML = `<div class="page">
    <div class="head"><h1>全部分组总览</h1><span>${data.videos.length} 段视频</span></div>
    <div class="stats">
      <div class="stat"><b>${tubes.length}</b><span>试管总数</span></div>
      <div class="stat"><b>${crossed}</b><span>确认过线（${Math.round(crossed / tubes.length * 100)}%）</span></div>
      <div class="stat"><b>${tubes.length - crossed}</b><span>未过线</span></div>
      <div class="stat"><b>${review}</b><span>需人工复核</span></div>
    </div>
    <div class="card">
      <h2>各组速度分布</h2><p class="sub">每个点是一管果蝇，点击打开对应视频。</p>
      <div class="toolbar">
        <span class="seg"><button data-metric="net_speed" class="${metric === "net_speed" ? "on" : ""}">净爬升速度</button><button data-metric="speed" class="${metric === "speed" ? "on" : ""}">5.5 cm 速度</button></span>
        <label><input type="checkbox" id="review" ${withReview ? "checked" : ""}> 包含需复核的管</label>
        <span class="legend"><span><i style="background:var(--s1)"></i>无需复核</span><span><i class="hollow"></i>需复核</span><span><i class="tick"></i>中位数</span></span>
      </div>
      <div class="chart" id="dots"></div>
    </div>
    <div class="card scroll">
      <h2>分组统计</h2><p class="sub">中位数只用上图选中的管。样本少于 8 时标出，不适合下结论。</p>
      <table><thead><tr><th>分组</th><th>管数</th><th>过线</th><th>过线率</th><th>未过线</th><th>需复核</th><th>中位速度 (cm/s)</th><th>样本数</th></tr></thead><tbody>
      ${stats.map(s => `<tr><td>${esc(s.group)}</td><td>${s.tubes.length}</td><td>${s.crossed}</td><td>${Math.round(s.crossed / s.tubes.length * 100)}%</td><td>${s.notReached}</td><td>${s.review}</td><td>${num(s.median)}</td><td>${s.used.length}${s.used.length < 8 ? ' <span class="small-n">样本少</span>' : ""}</td></tr>`).join("")}
      </tbody></table>
    </div>
    <div class="card scroll">
      <div class="card-head"><div><h2>每段视频的平均速度</h2><p class="sub">每段视频只算过线的管，没过线的管没有速度，不计入。需复核的管也计入平均，数量单独列出。点一行打开视频。</p></div>
        <a class="btn" href="/api/video-summary.csv" download="视频平均速度.csv">导出 CSV</a></div>
      <table><thead><tr><th class="left">分组</th><th class="left">视频</th><th>过线</th><th>其中需复核</th><th>平均净爬升速度 (cm/s)</th><th>平均 5.5 cm 速度 (cm/s)</th></tr></thead><tbody>
      ${data.videos.map(v => `<tr class="click" data-open="${esc(v.run)}"><td class="left">${esc(v.group)}</td><td class="left">${esc(v.stem)}</td><td>${v.crossed}/${v.tubes}</td><td>${v.crossed_review}</td><td>${num(v.mean_net_speed)}</td><td>${num(v.mean_speed)}</td></tr>`).join("")}
      </tbody></table>
    </div>
  </div>`;
  drawDots(stats);
}
function drawDots(stats) {
  const box = $("dots"), width = Math.max(560, box.clientWidth), rowHeight = 36, left = 96, right = 16, top = 8, bottom = 28;
  const height = top + bottom + rowHeight * stats.length;
  const values = stats.flatMap(s => s.used.map(t => t[metric]));
  const maximum = Math.max(1, ...values) * 1.05, x = value => left + value / maximum * (width - left - right);
  const step = maximum > 8 ? 2 : maximum > 4 ? 1 : .5;
  let svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="各组速度分布">`;
  for (let tick = 0; tick <= maximum; tick += step) svg += `<line class="grid-line" x1="${x(tick)}" x2="${x(tick)}" y1="${top}" y2="${height - bottom}"/><text x="${x(tick)}" y="${height - 10}" text-anchor="middle">${tick}</text>`;
  stats.forEach((s, row) => {
    const middle = top + rowHeight * row + rowHeight / 2;
    svg += `<text x="${left - 10}" y="${middle + 4}" text-anchor="end" style="fill:var(--text-2);font-size:12px">${esc(s.group)}</text>`;
    s.used.forEach((t, i) => {

function drawClimb(detail, player) {
  const box = $("climb"), width = Math.max(560, box.clientWidth), height = 300, left = 44, right = 30, top = 12, bottom = 30;
  const tubes = detail.report.results.map(r => r.tube_id), all = Object.values(detail.tracks).flat();
  const maxTime = Math.max(detail.duration, 1), top_cm = Math.max(detail.distance_cm + .5, ...all.map(p => p[1])), low_cm = Math.min(0, ...all.map(p => p[1]));
  const x = t => left + t / maxTime * (width - left - right), y = h => top + (top_cm - h) / (top_cm - low_cm) * (height - top - bottom);
  let svg = `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="六管爬升高度随时间变化">`;
  for (let cm = Math.ceil(low_cm); cm <= top_cm; cm++) svg += `<line class="grid-line" x1="${left}" x2="${width - right}" y1="${y(cm)}" y2="${y(cm)}"/><text x="${left - 8}" y="${y(cm) + 4}" text-anchor="end">${cm}</text>`;
  const step = maxTime > 40 ? 10 : 5;
  for (let t = 0; t <= maxTime; t += step) svg += `<text x="${x(t)}" y="${height - 10}" text-anchor="middle">${t} s</text>`;
  svg += `<line class="finish" x1="${left}" x2="${width - right}" y1="${y(detail.distance_cm)}" y2="${y(detail.distance_cm)}"/><text class="finish-label" x="${width - right}" y="${y(detail.distance_cm) - 5}" text-anchor="end">终点线</text>`;
  tubes.forEach((tube, i) => {
    const track = detail.tracks[tube] || [];
    let path = "", previous = null;
    track.forEach(point => { path += `${previous !== null && point[0] - previous > .5 ? "M" : path ? "L" : "M"}${x(point[0]).toFixed(1)} ${y(point[1]).toFixed(1)}`; previous = point[0]; });
    svg += `<path data-line="${esc(tube)}" d="${path}" fill="none" stroke="var(${SERIES[i]})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (track.length) { const end = track[track.length - 1]; svg += `<text class="direct" x="${Math.min(x(end[0]) + 4, width - 16)}" y="${y(end[1]) + 4}">${i + 1}</text>`; }
  });
  svg += `<line id="cursor" y1="${top}" y2="${height - bottom}" stroke="var(--text-3)" x1="-9" x2="-9"/><line id="playhead" y1="${top}" y2="${height - bottom}" stroke="var(--text)" stroke-width="1.5" x1="${x(0)}" x2="${x(0)}"/></svg>`;
  box.innerHTML = svg;
  const svgEl = box.querySelector("svg"), cursor = $("cursor"), playhead = $("playhead");
  const timeAt = event => { const rect = svgEl.getBoundingClientRect(); return Math.max(0, Math.min(maxTime, ((event.clientX - rect.left) / rect.width * width - left) / (width - left - right) * maxTime)); };
  svgEl.addEventListener("mousemove", event => {
    const t = timeAt(event);
    cursor.setAttribute("x1", x(t)); cursor.setAttribute("x2", x(t));
    const rows = tubes.map((tube, i) => {
      const track = detail.tracks[tube] || [], point = track.reduce((best, p) => Math.abs(p[0] - t) < Math.abs((best?.[0] ?? 1e9) - t) ? p : best, null);
      return point && Math.abs(point[0] - t) < .3 ? `${i + 1} 号管　${point[1].toFixed(2)} cm` : `${i + 1} 号管　—`;
    });
    showTip(event, `<b>${t.toFixed(1)} s</b><br>${rows.join("<br>")}`);
  });
  svgEl.addEventListener("mouseleave", () => { hideTip(); cursor.setAttribute("x1", -9); cursor.setAttribute("x2", -9); });
  svgEl.addEventListener("click", event => { player.currentTime = timeAt(event); });
  player.addEventListener("timeupdate", () => { playhead.setAttribute("x1", x(player.currentTime)); playhead.setAttribute("x2", x(player.currentTime)); });
  document.querySelectorAll(".tube").forEach(button => {
    const emphasis = on => box.querySelectorAll("path[data-line]").forEach(path => path.style.opacity = on && path.dataset.line !== button.dataset.tube ? .2 : 1);
    button.addEventListener("mouseenter", () => emphasis(true));
    button.addEventListener("mouseleave", () => emphasis(false));
  });
}

/* 任务和上传 */
const DISMISS = {running: "停止分析", queued: "取消排队", uploading: ""};
function renderJobs() {
  const local = uploads.map((item, index) => ({...item, local: index}));
  const rows = [...local, ...jobs.filter(j => j.state !== "done" || Date.now() / 1000 - j.created < 3600).reverse()];
  $("jobs").innerHTML = rows.map(job => {
    const percent = job.state === "uploading" ? job.percent : job.state === "running" ? Math.min(100, job.done_frames / Math.max(1, job.frames) * 100) : null;
    const chip = {done: "good", failed: "bad", needs_calibration: "warn"}[job.state] || "plain";
    const message = job.state === "needs_calibration" ? `${job.message} 点这里手动标定` : job.state === "running" ? `已过线 ${job.crossed}/6` : job.message;
    const label = DISMISS[job.state] ?? "从列表移除";
    return `<div class="job ${job.state === "needs_calibration" || job.run ? "link" : ""}" data-job="${esc(job.id || "")}" data-local="${job.local ?? ""}">
      <div class="name"><b title="${esc(job.name)}">${esc(job.name)}</b><span class="side"><span class="chip ${chip}">${STATES[job.state]}</span>${label ? `<button class="x" data-dismiss title="${label}" aria-label="${label}">×</button>` : ""}</span></div>
      ${percent === null ? "" : `<div class="bar"><i style="width:${percent}%"></i></div>`}
      ${message ? `<div class="msg">${esc(message)}</div>` : ""}</div>`;
  }).join("");
}
async function poll() {
  try {
    const next = await api("/api/jobs");
    const finished = next.some(job => job.state === "done" && !jobs.find(old => old.id === job.id && old.state === "done"));
    jobs = next; renderJobs();
    if (finished) { data = await api("/api/overview"); render(); }
  } catch { /* 服务关闭时下一轮再试 */ }
}
function upload(file, group) {
  return new Promise(resolve => {
    const item = {name: file.name, state: "uploading", percent: 0, message: ""};
    uploads.push(item); renderJobs();
    const request = new XMLHttpRequest();
    request.open("POST", `/api/upload?name=${encodeURIComponent(file.name)}&group=${encodeURIComponent(group)}`);
    request.upload.onprogress = event => { item.percent = event.loaded / event.total * 100; renderJobs(); };
    request.onloadend = () => {
      if (request.status === 200) uploads.splice(uploads.indexOf(item), 1);
      else { item.state = "failed"; try { item.message = JSON.parse(request.responseText).error; } catch { item.message = "上传失败"; } }
      poll(); resolve();
    };
    request.send(file);
  });
}
async function readEntry(entry, folder, found) {
  if (entry.isFile) {
    const file = await new Promise(resolve => entry.file(resolve));
    if (file.name.toLowerCase().endsWith(".mp4")) found.push([file, folder]);
    return;
  }
  const reader = entry.createReader();
  for (;;) {
    const batch = await new Promise(resolve => reader.readEntries(resolve));
    if (!batch.length) break;
    for (const child of batch) await readEntry(child, entry.name, found);
  }
}
async function take(pairs) { const fallback = $("group").value; for (const [file, folder] of pairs) await upload(file, folder || fallback); }
async function uploadEntries(entries) { const found = []; for (const entry of entries) await readEntry(entry, "", found); take(found); }
function notice(name, message) { uploads.push({name, state: "failed", message}); renderJobs(); }
async function act(promise) { try { return await promise; } catch (error) { notice("操作没有完成", error.message); return null; } }

/* 桌面版：窗口组件直接给出原视频路径，按路径分析，不复制视频；网页版才上传副本。 */
let desktop = false, pendingDrop = null, lastDesktopDrop = 0;
function detectDesktop() { desktop = Boolean(window.pywebview?.api?.choose_videos); document.body.classList.toggle("desktop", desktop); }
addEventListener("pywebviewready", detectDesktop);

}

/* 结果管理：改分组、重命名分组、删除（放进回收站） */
function ask({title, text, value = null, ok = "确定", danger = false}) {

    const input = $("ask-input"), okButton = $("ask-ok"), cancel = $("ask-cancel");
    $("ask-title").textContent = title; $("ask-text").textContent = text;

    okButton.textContent = ok; okButton.className = "btn " + (danger ? "danger" : "primary");
    $("ask").classList.add("open");

    const finish = answer => { $("ask").classList.remove("open"); okButton.onclick = cancel.onclick = input.onkeydown = null; resolve(answer); };
    okButton.onclick = () => finish(value === null ? true : input.value.trim());

  });
}

/* 手动标定 */
const HINTS = ["横线的左端", "横线的右端", ...[1, 2, 3, 4, 5, 6].map(i => `第 ${i} 根管的管底中心`)];
const PROBLEMS = {"line must go left to right and stay nearly level": "第二点要在左端右边，并且基本水平", "line must span all six tubes": "横线要横贯六根管：先点最左边的管子外侧，再点最右边的管子外侧", "tube bottom must be below the line": "管底要在横线下方",
  "tube bottom is too close to the line": "管底离横线太近。如果横线点错了，请点“撤销一步”回到前面重点",
  "click tubes from left to right": "请从左到右点管子", "tube bottoms must be at about the same height": "这一点比其他管底高太多，可能点到果蝇了，请点管子的最底部"};
let calibration = null;
function drawCalibration() {
  const {points, image, preview} = calibration, canvas = $("canvas"), context = canvas.getContext("2d");
  context.drawImage(preview || image, 0, 0, canvas.width, canvas.height);
  if (preview) return;
  context.fillStyle = context.strokeStyle = "#e0241f"; context.lineWidth = 2;
  points.forEach(([x, y]) => { context.beginPath(); context.arc(x, y, 7, 0, 7); context.fill(); });
  if (points.length >= 2) { context.beginPath(); context.moveTo(...points[0]); context.lineTo(...points[1]); context.stroke(); }
}
function stepText(error) {
  const {points, preview} = calibration, step = $("step");
  step.className = "step" + (error ? " error" : "");
  $("save").hidden = !preview;
  if (preview) { step.textContent = "检查预览：红线压在横线上，六个框各框住一根管"; $("note").textContent = "不对就点“撤销一步”重新点。"; return; }
  step.textContent = error ? `这一下没有采用：${PROBLEMS[error] || error}` : `第 ${points.length + 1} / 8 步：点${HINTS[points.length]}`;
  $("note").textContent = points.length < 2 ? "深色横线在管子中上部，横贯全部六根管。不要点管底，也不要点果蝇。" : "点管子最底部那圈圆弧的正中间。果蝇在哪里都不用管。";
}
function openCalibration(job) {
  const image = new Image();
  image.onload = () => {
    const canvas = $("canvas");
    canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
    calibration = {job, image, points: [], preview: null};
    $("modal").classList.add("open"); drawCalibration(); stepText();
  };
  image.src = "/api/calibration-frame?job=" + job;
}
$("canvas").addEventListener("click", async event => {
  if (!calibration || calibration.preview) return;
  const rect = event.target.getBoundingClientRect(), {points} = calibration;
  const point = [Math.round((event.clientX - rect.left) / rect.width * event.target.width), Math.round((event.clientY - rect.top) / rect.height * event.target.height)];
  const {problem} = await api("/api/check-click", {points, point, size: [calibration.image.naturalWidth, calibration.image.naturalHeight]});
  if (problem) return stepText(problem);
  points.push(point); drawCalibration(); stepText();
  if (points.length === 8) {
    try {
      const {preview} = await api("/api/calibrate", {job: calibration.job, line: points.slice(0, 2), bottoms: points.slice(2)});
      const image = new Image();
      image.onload = () => { calibration.preview = image; drawCalibration(); stepText(); };
      image.src = "data:image/jpeg;base64," + preview;
    } catch (error) { points.pop(); drawCalibration(); stepText(error.message); }
  }
});
$("undo").addEventListener("click", () => { if (!calibration) return; calibration.preview = null; calibration.points.pop(); drawCalibration(); stepText(); });
$("cancel").addEventListener("click", () => { calibration = null; $("modal").classList.remove("open"); });
$("save").addEventListener("click", async () => {
  const {job, points} = calibration;
  await api("/api/calibrate", {job, line: points.slice(0, 2), bottoms: points.slice(2), confirm: true});
  calibration = null; $("modal").classList.remove("open"); poll();
});

/* 事件委托：列表每次轮询都会重建 */
$("tree").addEventListener("click", event => {
  const more = event.target.closest(".more");
  if (more) {
    event.preventDefault(); event.stopPropagation();
    return openMenu(more, more.dataset.menu ? videoMenu(more.dataset.menu) : groupMenu(more.dataset.groupMenu));
  }
  const target = event.target.closest("[data-run],[data-overview]");
  if (!target) return;
  if (target.dataset.run) openRun(target.dataset.run);
  else { view = {page: "overview"}; render(); }
});
$("tree").addEventListener("contextmenu", event => {
  const row = event.target.closest(".row"), summary = event.target.closest("summary");
  const more = (row || summary)?.querySelector(".more");
  if (!more) return;
  event.preventDefault();
  const point = {left: event.clientX, bottom: event.clientY};
  openMenu(point, more.dataset.menu ? videoMenu(more.dataset.menu) : groupMenu(more.dataset.groupMenu));
});
$("jobs").addEventListener("click", async event => {
  const card = event.target.closest(".job");
  if (!card) return;
  if (event.target.closest("[data-dismiss]")) {
    if (!card.dataset.job) { uploads.splice(Number(card.dataset.local), 1); return renderJobs(); }
    const job = jobs.find(item => item.id === card.dataset.job);
    if (job?.state === "running" && !await ask({title: `停止分析 ${job.name}？`, text: "这一段已分析的部分不会保存。", ok: "停止", danger: true})) return;
    await act(api("/api/dismiss", {job: card.dataset.job}));
    return poll();
  }
  const job = jobs.find(item => item.id === card.dataset.job);
  if (job?.state === "needs_calibration") openCalibration(job.id);
  else if (job?.run && data.videos.some(v => v.run === job.run)) openRun(job.run);
});
$("main").addEventListener("click", event => {
  if (event.target.dataset.metric) { metric = event.target.dataset.metric; renderOverview(); }
  const action = event.target.closest("[data-act]")?.dataset.act, video = data.videos.find(v => v.run === view.run);
  if (action === "move" && video) moveVideo(video);
  if (action === "delete" && video) deleteVideo(video);
  const row = event.target.closest("[data-open]");
  if (row) openRun(row.dataset.open);
});
$("main").addEventListener("change", event => {
  if (event.target.id === "review") { withReview = event.target.checked; renderOverview(); }
});
addEventListener("resize", () => { if (view.page === "overview" && data.tubes.length) renderOverview(); });
detectDesktop();
api("/api/info").then(info => { $("brand-sub").textContent = `v${info.version} · 六管单蝇 · 本机运行，视频不外传`; }).catch(() => {});
(async () => { data = await api("/api/overview"); render(); poll(); setInterval(poll, 1500); })();
</script>
</body>
